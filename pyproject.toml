[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearsky-stargazing"
version = "1.1.0"
description = "ClearSky观星指数算法实现 (stargazing.twtapp.com) + 数据源 URL 健康检查"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "elegy" }]
keywords = ["astronomy", "stargazing", "观星", "天气", "weather", "clear-sky", "healthcheck"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Internet :: WWW/HTTP",
]
# 运行时零第三方依赖：评分算法与健康检查均只使用 Python 标准库
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]
dev = [
    "build>=1.0",
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/example/clearsky-stargazing"
Source = "https://github.com/example/clearsky-stargazing"

[project.scripts]
clearsky = "clearsky.cli:main"

[tool.setuptools]
packages = ["clearsky"]

[tool.setuptools.package-data]
clearsky = ["algorithm.json", "data/*.csv", "data/*.json"]
